[package]
name = "picamatl"
version = "0.4.0"
description = "Pure-Rust PDF size optimizer: CTM-aware effective-DPI downsampling of embedded JPEG and Flate images, opt-in Type0 font subsetting, with a hard fail-safe contract. No Ghostscript; everything stays on your machine."
authors = ["Xchel Dominguez <xjdom2@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xcheljd/picamatl"
readme = "README.md"
keywords = ["pdf", "compression", "optimizer", "jpeg", "mozjpeg"]
categories = ["compression", "multimedia::images"]
edition = "2021"
# Dependency-driven floor, not from this crate's own code: lopdf 0.42.0 needs
# edition 2024 (Cargo/Rust >= 1.85), and current image/time releases need 1.88.
rust-version = "1.88.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Verified 2026-08-24: lopdf 0.44 compiles clean against time 0.3.55 (the old
# FormatItem::StringLiteral break is gone), and with default-features off the
# chrono/jiff/time datetime backends drop out of the tree entirely. picamatl never
# parses PDF datetimes itself, and corpus outputs are byte-identical either way.
lopdf = { version = "0.44", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mozjpeg = "0.10"
# Re-deflating downsampled FlateDecode images at a controlled level (9) with
# our own predictor choice. Already in the tree transitively via lopdf, so this
# adds zero new code to the build. The zlib-rs backend (pure Rust, via
# libz-rs-sys) out-compresses the default miniz_oxide at the same level; the
# strictly-smaller guard in redeflate_flate_streams makes the swap risk-free.
flate2 = { version = "1", features = ["zlib-rs"] }
# Parallel image work. Pure Rust, MIT OR Apache-2.0, no native deps.
rayon = "1"
# Opt-in exhaustive deflate for the final re-deflate + xref passes
# (--deflate-backend zopfli). Pure Rust, Apache-2.0, rust-version 1.73.
# Measured on the NASA reference: −142 KB over zlib-rs level 9 at ~30× the
# CPU (still a one-digit-seconds run); the strictly-smaller + inflate-back
# guard applies unchanged, so the swap is risk-free. gzip feature off — only
# the zlib container is ever emitted.
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }
# Font subsetting (typst org; MIT OR Apache-2.0, rust-version 1.85). With
# default-features = false the entire transitive footprint is one crate
# (rustc-hash); the `variable-fonts` feature (skrifa & co.) is deliberately
# off — variable fonts then fail subsetting and are skipped, fail-safe.
subsetter = { version = "0.2.6", default-features = false }
# CCITT G3/G4 codec for lossless bitonal image recompression (B-M1). Vetted in
# docs/PHASE3-PLAN.md §B.3: MIT, #![deny(unsafe_code)], rust-version 1.71,
# zero transitive dependencies.
fax = "0.3.0"
# CLI argument parsing for the `picamatl` binary only; the library does not
# depend on it. clap 4.6 declares rust-version 1.85, inside our 1.88 MSRV.
clap = { version = "4.6.6", features = ["derive"] }
# Pure-Rust JPEG 2000 (Part 1 + HTJ2K) decoder for the opt-in JPXDecode →
# DCTDecode conversion under --allow-lossy. Fork of hayro-jpeg2000 whose
# release keeps rust-version 1.80 (hayro's own 0.4.0 requires 1.92, outside
# our 1.88 floor). #![forbid(unsafe_code)]; MIT OR Apache-2.0; the
# openjph-htj2k feature pulls openjph-core (pure-Rust OpenJPH port,
# BSD-2-Clause) for High-Throughput codestreams only — classic EBCOT/MQ
# decode is entirely in-crate. Decode-only here: any header/decode error
# leaves the stream byte-identical, same posture as every other image path.
dicom-toolkit-jpeg2000 = "0.5.0"

[[bin]]
name = "picamatl"
path = "src/main.rs"

[dev-dependencies]
# Test-only verification oracle for the font-subsetting path: per-glyph
# outline + advance equality between the original and subset font programs.
# Never a runtime dependency.
ttf-parser = "0.25.1"
# PNG support for the Phase 7 spike tooling (examples/spike_*.rs) only; the
# library itself keeps its jpeg-only image build.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
