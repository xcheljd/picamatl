[package]
name = "amatl"
version = "0.2.2"
description = "Pure-Rust PDF size optimizer: CTM-aware effective-DPI downsampling of embedded JPEG and Flate images, opt-in Type0 font subsetting, with a hard fail-safe contract"
authors = ["Xchel Dominguez <xjdom2@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xcheljd/amatl"
readme = "README.md"
keywords = ["pdf", "compression", "optimizer", "jpeg", "mozjpeg"]
categories = ["compression", "multimedia::images"]
edition = "2021"
# Dependency-driven floor, not from this crate's own code: lopdf 0.42.0 needs
# edition 2024 (Cargo/Rust >= 1.85), and current image/time releases need 1.88.
rust-version = "1.88.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Hard ceiling: 0.43 and 0.44 do not compile against current `time` (their
# datetime.rs calls FormatItem::StringLiteral, removed in time 0.3.47).
# Re-test the bump when lopdf publishes a release that fixes this.
lopdf = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mozjpeg = "0.10"
# Re-deflating downsampled FlateDecode images at a controlled level (9) with
# our own predictor choice. Already in the tree transitively via lopdf, so this
# adds zero new code to the build.
flate2 = "1"
# Parallel image work. Pure Rust, MIT OR Apache-2.0, no native deps.
rayon = "1"
# Font subsetting (typst org; MIT OR Apache-2.0, rust-version 1.85). With
# default-features = false the entire transitive footprint is one crate
# (rustc-hash); the `variable-fonts` feature (skrifa & co.) is deliberately
# off — variable fonts then fail subsetting and are skipped, fail-safe.
subsetter = { version = "0.2.6", default-features = false }
# CCITT G3/G4 codec for lossless bitonal image recompression (B-M1). Vetted in
# docs/PHASE3-PLAN.md §B.3: MIT, #![deny(unsafe_code)], rust-version 1.71,
# zero transitive dependencies.
fax = "0.3.0"
# CLI argument parsing for the `amatl` binary only; the library does not
# depend on it. clap 4.6 declares rust-version 1.85, inside our 1.88 MSRV.
clap = { version = "4.6.6", features = ["derive"] }

[[bin]]
name = "amatl"
path = "src/main.rs"

[dev-dependencies]
# Test-only verification oracle for the font-subsetting path: per-glyph
# outline + advance equality between the original and subset font programs.
# Never a runtime dependency.
ttf-parser = "0.25.1"
# PNG support for the Phase 7 spike tooling (examples/spike_*.rs) only; the
# library itself keeps its jpeg-only image build.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
