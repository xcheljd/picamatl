name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        # Pinned to a commit SHA — channel must be set explicitly when pinned.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      # mozjpeg compiles libjpeg-turbo (needs NASM for x86_64 SIMD); cmake is
      # already on the runner.
      - name: Install NASM (for mozjpeg)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test
        run: cargo test

      - name: Doc tests
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # The crate records rust-version = "1.77.2" (MSRV); verify it actually
  # builds there so the claim can't silently rot.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust 1.77.2 (MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.77.2
        with:
          toolchain: 1.77.2

      - name: Install NASM (for mozjpeg)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build on MSRV
        run: cargo build
